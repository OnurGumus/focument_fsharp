name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The tests are an Expecto console runner (no VSTest adapter), so run the
      # exe directly — its exit code reflects pass/fail.
      - name: Test
        run: dotnet run --project tests/Domain.Tests -c Release --no-build
